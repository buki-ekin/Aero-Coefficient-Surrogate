[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aero-surrogate"
version = "1.2.0"
description = "Random Forest surrogate modelling from flow5 airfoil polar data."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Buket Ekin" }
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.4",
    "matplotlib>=3.8"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "build>=1.2",
    "ruff>=0.5",
    "pdoc>=14.0"
]

[project.scripts]
aero-surrogate = "aero_surrogate.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"aero_surrogate.resources" = [
    "flow5_random_forest.pkl",
    "flow5_airfoils.csv",
    "aerosurrogate_dashboard.html",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.coverage.run]
branch = true
source = ["aero_surrogate"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
ignore = ["B905"]
