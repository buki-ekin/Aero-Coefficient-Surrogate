[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aero-surrogate"
version = "1.0.0"
description = "Random Forest surrogate modelling from flow5 airfoil polar data."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Buket Ekin" }
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.4"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "build>=1.2"
]

[project.scripts]
aero-surrogate = "aero_surrogate.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
